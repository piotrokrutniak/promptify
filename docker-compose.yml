services:
  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5672:5672"
      - "15672:15672"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: PromptifyWebApiDb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d PromptifyWebApiDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  webapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__PromptifyWebApiDb: Host=db;Port=5432;Database=PromptifyWebApiDb;Username=admin;Password=password
      ConnectionStrings__messaging: amqp://guest:guest@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/scalar"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: Docker
      ConnectionStrings__PromptifyWebApiDb: Host=db;Port=5432;Database=PromptifyWebApiDb;Username=admin;Password=password
      ConnectionStrings__messaging: amqp://guest:guest@rabbitmq:5672
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      webapi:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://webapi:8080
      PUBLIC_API_BASE_URL: http://localhost:8080
      AUTH_COOKIE_SECURE: "false"
    depends_on:
      webapi:
        condition: service_healthy

volumes:
  pgdata:
