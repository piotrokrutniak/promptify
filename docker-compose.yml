services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: PromptifyWebApiDb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d PromptifyWebApiDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  webapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: Docker
    depends_on:
      db:
        condition: service_healthy
      webapi:
        condition: service_started

volumes:
  pgdata:
